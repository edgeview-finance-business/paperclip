name: Gitleaks Secret Scan

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          install_dir="$RUNNER_TEMP/gitleaks/bin"
          mkdir -p "$install_dir"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gitleaks" version

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_LOG_OPTS: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: gitleaks git --verbose --redact --no-banner --log-opts="$GITLEAKS_LOG_OPTS"

      - name: Scan current ref
        if: github.event_name == 'workflow_dispatch'
        run: gitleaks git --verbose --redact --no-banner --log-opts="--max-count=1"
